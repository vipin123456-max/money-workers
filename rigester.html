<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Money Works</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(135deg, #111827, #2563eb);
            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            border-radius: 18px;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(37,99,235,0.35);
        }

        .logo h1 {
            margin-top: 12px;
            color: #111827;
            font-size: 27px;
        }

        .logo p {
            margin-top: 5px;
            color: #6b7280;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #111827;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
        }

        .bottom-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="auth-box">

        <div class="logo">

            <div class="logo-icon">
                ₹
            </div>

            <h1>Money Works</h1>

            <p>Manage Your Money Smarter</p>

        </div>

        <h2>Create Account</h2>

        <form onsubmit="registerUser(event)">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>

            <button class="btn" type="submit">
                Create Account
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="bottom-text">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>


<script>

function registerUser(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    if (password !== confirmPassword) {

        message.style.color = "#dc2626";

        message.innerText =
            "Passwords do not match.";

        return;
    }


    const user = {

        name: name,

        email: email,

        password: password

    };


    localStorage.setItem(
        "moneyWorksUser",
        JSON.stringify(user)
    );


    message.style.color = "#16a34a";

    message.innerText =
        "Account created successfully!";


    setTimeout(() => {

        window.location.href =
            "/login.html";

    }, 1000);

}

</script>

</body>
</html>
